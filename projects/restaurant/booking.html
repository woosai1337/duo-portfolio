<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATELIER — Бронь столика</title>
  <meta name="description" content="Сезонное меню, зал ресторана и демонстрация бронирования столика.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap">
  <link rel="stylesheet" href="../showcase-v1.css">
  <link rel="stylesheet" href="../art-v3.css">
  <link rel="stylesheet" href="../variety-v2.css">
  <script src="../showcase-v2.js" defer></script>
</head>
<body class="atelier">
  <a class="skip" href="#main">К содержанию</a>
  <header class="site-header shell">
    <a class="logo" href="./?v=variety2" aria-label="ATELIER — главная">ATELIER</a>
    <nav class="site-nav" aria-label="Разделы сайта"><a href="./?v=variety2">Главная</a><a href="menu.html">Меню</a><a href="space.html">Зал</a></nav>
    <a class="button header-action" aria-current="page" href="booking.html">Забронировать <span aria-hidden="true">→</span></a>
  </header>
  <main class="stage shell" id="main">
    <section class="form-layout">
      <figure class="feature-media"><img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&amp;fit=crop&amp;w=1080&amp;q=83" srcset="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&amp;fit=crop&amp;w=640&amp;q=83 640w, https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&amp;fit=crop&amp;w=1080&amp;q=83 1080w" sizes="(max-width: 660px) 100vw, 60vw" alt="Столики ресторанного зала" decoding="async"></figure>
      <div class="booking-box">
        <h1>Бронь столика</h1>
        <p>Можно пройти весь сценарий. Данные останутся у вас.</p>
        <form data-booking>
          <div class="booking-fields">
            <label><span>Место</span><select name="choice"><option>Любой стол</option><option>У окна</option><option>В глубине зала</option><option>Большой стол</option></select></label>
            <label><span>Дата</span><input type="date" name="date" required></label><label><span>Время</span><select name="time"><option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option><option>21:00</option></select></label><label><span>Гости</span><select name="party"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
          </div>
          <button class="button" type="submit">Посмотреть итог <span aria-hidden="true">→</span></button>
        </form>
        <output data-confirmation hidden>
          <h2 tabindex="-1">Ваши детали</h2>
          <p data-summary></p>
          <p>Это демонстрация. Заявка не отправлена.</p>
          <button class="button ghost" type="button">Изменить выбор</button>
        </output>
      </div>
    </section>
  </main>
  <footer class="site-footer shell">
    <a href="../../#work">← Все проекты</a>
    <span>Демонстрационный сайт</span>
  </footer>
</body>
</html>
