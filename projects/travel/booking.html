<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELSEWHERE — Подобрать путешествие</title>
  <meta name="description" content="Три маршрута с программами по дням: Исландия, Доломиты и Марокко.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Oswald:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../showcase-v1.css">
  <link rel="stylesheet" href="../art-v2.css">
  <script src="../showcase-v2.js" defer></script>
</head>
<body class="travel">
  <a class="skip" href="#main">К содержанию</a>
  <header class="site-header shell">
    <a class="logo" href="./?v=design2" aria-label="ELSEWHERE — главная">elsewhere<span>→</span></a>
    <nav class="site-nav" aria-label="Разделы сайта"><a href="./?v=design2">Главная</a><a href="routes.html">Маршруты</a><a href="approach.html">Как едем</a></nav>
    <a class="button header-action" aria-current="page" href="booking.html">Подобрать тур <span aria-hidden="true">→</span></a>
  </header>
  <main class="stage shell" id="main">
    <section class="form-layout">
      <figure class="feature-media"><img src="https://images.unsplash.com/photo-1476610182048-b716b8518aae?auto=format&amp;fit=crop&amp;w=1080&amp;q=83" srcset="https://images.unsplash.com/photo-1476610182048-b716b8518aae?auto=format&amp;fit=crop&amp;w=640&amp;q=83 640w, https://images.unsplash.com/photo-1476610182048-b716b8518aae?auto=format&amp;fit=crop&amp;w=1080&amp;q=83 1080w" sizes="100vw" alt="Водопад среди зелёных склонов" decoding="async"></figure>
      <div class="booking-box">
        <h1>Подобрать путешествие</h1>
        <p>Можно пройти весь сценарий. Данные останутся у вас.</p>
        <form data-booking>
          <div class="booking-fields">
            <label><span>Маршрут</span><select name="choice"><option>Исландия</option><option>Доломиты</option><option>Марокко</option><option>Помогите выбрать</option></select></label>
            <label><span>Сезон</span><select name="season"><option>Весна</option><option>Лето</option><option>Осень</option><option>Зима</option><option>Пока не решил</option></select></label><label><span>Путешественники</span><select name="party"><option>1</option><option>2</option><option>3</option><option>4</option><option>5 и больше</option></select></label>
          </div>
          <button class="button" type="submit">Посмотреть итог <span aria-hidden="true">→</span></button>
        </form>
        <output data-confirmation hidden>
          <h2 tabindex="-1">Ваши детали</h2>
          <p data-summary></p>
          <p>Это демонстрация. Заявка не отправлена.</p>
          <button class="button ghost" type="button">Изменить выбор</button>
        </output>
      </div>
    </section>
  </main>
  <footer class="site-footer shell">
    <a href="../../#work">← Все проекты</a>
    <span>Демонстрационный сайт</span>
  </footer>
</body>
</html>
